name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: 'Also run the memory comparison with Chrome and Brave'
        type: boolean
        default: true

permissions:
  contents: write

env:
  ELECTRON_VERSION: 45.1.0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python -m pip install pillow

      - name: Download Electron (checksum verified)
        shell: bash
        run: |
          base=https://github.com/electron/electron/releases/download/v$ELECTRON_VERSION
          f=electron-v$ELECTRON_VERSION-win32-x64.zip
          curl -sSfL -o $f $base/$f
          curl -sSfL -o SHASUMS256.txt $base/SHASUMS256.txt
          grep " \*$f\$" SHASUMS256.txt | sed 's/ \*/  /' | sha256sum -c -

      - name: Build the app folder (dist/3zT)
        run: python scripts/build_win.py electron-v${{ env.ELECTRON_VERSION }}-win32-x64.zip

      - name: Install Inno Setup (6.6+ for the dark wizard)
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Select-Object -Last 3
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { echo "::error title=inno::ISCC.exe not found"; exit 1 }
          $ver = (& $iscc /? 2>&1 | Select-String 'Inno Setup' | Select-Object -First 1).ToString().Trim()
          echo "::notice title=inno::$ver"
          "ISCC=$iscc" >> $env:GITHUB_ENV
          # Arabic wizard text: comes with Inno Setup; otherwise take it from the Inno Setup source repo
          $ar = Join-Path (Split-Path $iscc) 'Languages\Arabic.isl'
          if (Test-Path $ar) { Copy-Item $ar installer\Arabic.isl }
          else {
            try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Arabic.isl -OutFile installer\Arabic.isl }
            catch { echo "::error title=inno::Arabic.isl download failed: $_"; exit 1 }
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $log = & $env:ISCC installer\3zT.iss "/DAppVersion=$v" 2>&1
          if ($LASTEXITCODE) { $t = ($log | Select-Object -Last 15) -join '%0A'; echo "::error title=iscc::$t"; exit $LASTEXITCODE }
          Get-Item dist\3zT-Browser-Setup.exe | Format-List Name,Length

      - name: Test the installer (silent install, shortcut, uninstall)
        shell: pwsh
        run: |
          Start-Process dist\3zT-Browser-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon','/LOG=dist\install.log' -Wait
          $app = "$env:LOCALAPPDATA\Programs\3zT\3zT.exe"
          $lnk = [Environment]::GetFolderPath('Desktop') + '\3zT.lnk'
          $start = [Environment]::GetFolderPath('Programs') + '\3zT.lnk'
          $ok = (Test-Path $app) -and (Test-Path $lnk) -and (Test-Path $start)
          "installed exe: $(Test-Path $app)  desktop shortcut: $(Test-Path $lnk)  start menu: $(Test-Path $start)"
          $reg = Get-ItemProperty 'HKCU:\Software\Clients\StartMenuInternet\3zT Browser\Capabilities' -ErrorAction SilentlyContinue
          "registered as a browser: $([bool]$reg)"
          echo "::notice title=install::exe $(Test-Path $app), desktop shortcut $(Test-Path $lnk), start menu $(Test-Path $start), browser registration $([bool]$reg)"
          if (-not $ok -or -not $reg) { $t = (Get-Content dist\install.log -Tail 15) -join '%0A'; echo "::error title=install::$t"; exit 1 }

      - name: End-to-end test of the installed app (pages + real Chrome Web Store installs)
        shell: pwsh
        run: node tests/e2e.mjs "$env:LOCALAPPDATA\Programs\3zT\3zT.exe" --store

      - name: Uninstall test
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\3zT\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          $gone = -not (Test-Path "$env:LOCALAPPDATA\Programs\3zT\3zT.exe") -and -not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\3zT.lnk')) -and -not (Test-Path 'HKCU:\Software\Clients\StartMenuInternet\3zT Browser')
          echo "::notice title=uninstall::removed cleanly: $gone"
          if (-not $gone) { exit 1 }

      - name: Install Brave for the memory comparison
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.bench)
        continue-on-error: true
        run: choco install brave -y --no-progress

      - name: Memory comparison (3zT vs Chrome vs Brave)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.bench)
        continue-on-error: true
        shell: pwsh
        run: |
          ./tests/bench.ps1
          if (Test-Path tests/out/bench.md) { $t = (Get-Content tests/out/bench.md) -join '%0A'; echo "::notice title=bench::$t" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3zT-windows
          path: |
            dist/3zT-Browser-Setup.exe
            dist/install.log
            tests/out/

      - name: Publish the release (once per version in package.json)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then echo "::notice title=release::$v already published"; exit 0; fi
          notes="Download **3zT-Browser-Setup.exe** below and run it. Windows 10/11, 64-bit. No administrator rights needed."
          [ -f tests/out/bench.md ] && notes="$notes"$'\n\n### Memory on this build\nSame 3 websites in 3 tabs, new profiles, GitHub Windows machine, two rounds averaged:\n\n'"$(cat tests/out/bench.md)"
          gh release create "$v" dist/3zT-Browser-Setup.exe --target "$GITHUB_SHA" --title "3zT $v" --notes "$notes"
          echo "::notice title=release::published $v"
