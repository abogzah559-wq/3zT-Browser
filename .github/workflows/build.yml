name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: 'Also run the memory comparison with Chrome and Brave'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # the Electron version is the one in package.json (the weekly security update changes only that file)
      - name: Electron version
        shell: bash
        run: echo "ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_ENV"
      - run: python -m pip install pillow

      - name: Download Electron (checksum verified)
        shell: bash
        run: |
          base=https://github.com/electron/electron/releases/download/v$ELECTRON_VERSION
          f=electron-v$ELECTRON_VERSION-win32-x64.zip
          curl -sSfL -o $f $base/$f
          curl -sSfL -o SHASUMS256.txt $base/SHASUMS256.txt
          grep " \*$f\$" SHASUMS256.txt | sed 's/ \*/  /' | sha256sum -c -

      - name: Video downloader tools (yt-dlp, gallery-dl, FFmpeg; checksums checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch_tools.mjs tools-cache

      - name: Cookie-popup rules (DuckDuckGo Autoconsent, pinned, sha512 checked)
        run: node scripts/fetch_autoconsent.mjs

      - name: Build the app folder (dist/3zT)
        run: python scripts/build_win.py electron-v${{ env.ELECTRON_VERSION }}-win32-x64.zip

      - name: Install Inno Setup (6.6+ for the dark wizard)
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Select-Object -Last 3
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { echo "::error title=inno::ISCC.exe not found"; exit 1 }
          $ver = (& $iscc /? 2>&1 | Select-String 'Inno Setup' | Select-Object -First 1).ToString().Trim()
          echo "::notice title=inno::$ver"
          "ISCC=$iscc" >> $env:GITHUB_ENV
          # Arabic wizard text: comes with Inno Setup; otherwise take it from the Inno Setup source repo
          $ar = Join-Path (Split-Path $iscc) 'Languages\Arabic.isl'
          if (Test-Path $ar) { Copy-Item $ar installer\Arabic.isl }
          else {
            try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Arabic.isl -OutFile installer\Arabic.isl }
            catch { echo "::error title=inno::Arabic.isl download failed: $_"; exit 1 }
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $log = & $env:ISCC installer\3zT.iss "/DAppVersion=$v" 2>&1
          if ($LASTEXITCODE) { $t = ($log | Select-Object -Last 15) -join '%0A'; echo "::error title=iscc::$t"; exit $LASTEXITCODE }
          Get-Item dist\3zT-Browser-Setup.exe | Format-List Name,Length

      - name: Test the installer (silent install, shortcut, uninstall)
        shell: pwsh
        run: |
          Start-Process dist\3zT-Browser-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon','/LOG=dist\install.log' -Wait
          $app = "$env:LOCALAPPDATA\Programs\3zT\3zT.exe"
          $lnk = [Environment]::GetFolderPath('Desktop') + '\3zT.lnk'
          $start = [Environment]::GetFolderPath('Programs') + '\3zT.lnk'
          $ok = (Test-Path $app) -and (Test-Path $lnk) -and (Test-Path $start)
          "installed exe: $(Test-Path $app)  desktop shortcut: $(Test-Path $lnk)  start menu: $(Test-Path $start)"
          $reg = Get-ItemProperty 'HKCU:\Software\Clients\StartMenuInternet\3zT Browser\Capabilities' -ErrorAction SilentlyContinue
          "registered as a browser: $([bool]$reg)"
          echo "::notice title=install::exe $(Test-Path $app), desktop shortcut $(Test-Path $lnk), start menu $(Test-Path $start), browser registration $([bool]$reg)"
          if (-not $ok -or -not $reg) { $t = (Get-Content dist\install.log -Tail 15) -join '%0A'; echo "::error title=install::$t"; exit 1 }

      - name: Song recognition (library download and checksums, fingerprint, Shazam's answer)
        run: node tests/songid.mjs

      - name: TikTok layout names (checks, merging, the copy on GitHub)
        run: node tests/social.mjs

      - name: End-to-end test of the installed app (pages + real Chrome Web Store installs)
        shell: pwsh
        run: node tests/e2e.mjs "$env:LOCALAPPDATA\Programs\3zT\3zT.exe" --store

      - name: Silent update test (installed version updates itself to a newer build)
        shell: pwsh
        run: |
          # a "newer" build of the same code, version 9.9.9, used only for this test
          Copy-Item dist\3zT-Browser-Setup.exe "$env:RUNNER_TEMP\current.exe"
          $pkg = Get-Content package.json -Raw
          ($pkg -replace '"version":\s*"[^"]+"', '"version": "9.9.9"') | Set-Content package.json -NoNewline
          python scripts/build_win.py electron-v${{ env.ELECTRON_VERSION }}-win32-x64.zip | Out-Null
          & $env:ISCC installer\3zT.iss "/DAppVersion=9.9.9" | Out-Null
          Move-Item dist\3zT-Browser-Setup.exe "$env:RUNNER_TEMP\next.exe" -Force
          git checkout -- package.json
          # back to the real build for the next steps
          python scripts/build_win.py electron-v${{ env.ELECTRON_VERSION }}-win32-x64.zip | Out-Null
          Copy-Item "$env:RUNNER_TEMP\current.exe" dist\3zT-Browser-Setup.exe
          node tests/update-test.mjs "$env:LOCALAPPDATA\Programs\3zT\3zT.exe" "$env:RUNNER_TEMP\next.exe" 9.9.9

      - name: Uninstall test
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\3zT\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          $gone = -not (Test-Path "$env:LOCALAPPDATA\Programs\3zT\3zT.exe") -and -not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\3zT.lnk')) -and -not (Test-Path 'HKCU:\Software\Clients\StartMenuInternet\3zT Browser')
          echo "::notice title=uninstall::removed cleanly: $gone"
          if (-not $gone) { exit 1 }

      - name: Install Brave for the memory comparison
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.bench)
        continue-on-error: true
        run: choco install brave -y --no-progress

      - name: Memory comparison (3zT vs Chrome vs Brave)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.bench)
        continue-on-error: true
        shell: pwsh
        run: |
          ./tests/bench.ps1
          if (Test-Path tests/out/bench.md) { $t = (Get-Content tests/out/bench.md) -join '%0A'; echo "::notice title=bench::$t" }

      - name: Page speed comparison (3zT vs Chrome vs Brave)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.bench)
        continue-on-error: true
        shell: pwsh
        run: |
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $brave = @("$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe", "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          node tests/speed.mjs "$PWD\dist\3zT\3zT.exe" "$chrome" "$brave"

      - name: Resource use in everyday situations (1/5/10 tabs, video, second window, download, leak check)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: node tests/resources.mjs "$PWD\dist\3zT\3zT.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3zT-windows
          path: |
            dist/3zT-Browser-Setup.exe
            dist/install.log
            tests/out/

      - name: Publish the release (once per version in package.json)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then echo "::notice title=release::$v already published"; exit 0; fi
          # what's new (English) from CHANGELOG.md; the browser's "Details" button reads it
          changes="$(node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8').replace(/\r/g,'');const v=require('./package.json').version;const p=s.split(/^## /m).find(x=>x.split('\n')[0].trim()===v);process.stdout.write(p?'## What\'s new in '+p.trim():'')")"
          notes="Download **3zT-Browser-Setup.exe** below and run it. Windows 10/11, 64-bit. No administrator rights needed. Installed copies update themselves."
          [ -n "$changes" ] && notes="$notes"$'\n\n'"$changes"
          # the Arabic notes for the browser's "Details" button, hidden in the release text (installer/notes-ar.md)
          ar="$(node -e "const s=require('fs').readFileSync('installer/notes-ar.md','utf8').replace(/\r/g,'');const v=require('./package.json').version;const p=s.split(/^## /m).find(x=>x.split('\n')[0].trim()===v);process.stdout.write(p?p.split('\n').slice(1).join('\n').trim():'')")"
          [ -n "$ar" ] && notes="$notes"$'\n\n<!-- 3zt-ar\n'"$ar"$'\n-->'
          [ -f tests/out/speed.md ] && notes="$notes"$'\n\n### Page speed on this build\nSame websites, new profiles, GitHub Windows machine:\n\n'"$(cat tests/out/speed.md)"
          [ -f tests/out/resources.md ] && notes="$notes"$'\n\n### Resource use on this build\nGitHub Windows machine (no graphics card), new profile, all 3zT processes added up, CPU averaged over 20 s:\n\n'"$(cat tests/out/resources.md)"
          [ -f tests/out/bench.md ] && notes="$notes"$'\n\n### Memory on this build\nSame 3 websites in 3 tabs, new profiles, GitHub Windows machine, two rounds averaged:\n\n'"$(cat tests/out/bench.md)"
          (cd dist && sha256sum 3zT-Browser-Setup.exe | cut -d' ' -f1 > 3zT-Browser-Setup.exe.sha256)
          # installed browsers only accept a signed update: no key, no release
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::warning title=release::$v not published: add the UPDATE_SIGNING_KEY secret first"; exit 0; fi
          node scripts/sign-update.mjs dist/3zT-Browser-Setup.exe "${v#v}"
          # light update bundle: made here because the update test above rebuilds dist
          # only for copies whose program file (3zT.exe: icon, Electron) is the same: "exeGen" in package.json, written to resources/exegen.txt
          python scripts/make_app_bundle.py dist/3zT/resources/app dist/3zT-app.json "$ELECTRON_VERSION+exe$(node -p "require('./package.json').exeGen || 1")"
          node scripts/sign-update.mjs dist/3zT-app.json "${v#v}"
          # latest.json: what installed copies read to find this release (a plain download, no API rate limit);
          # the same fields as GitHub's API answer. The files it lists are still checked by their signatures.
          NOTES="$notes" V="$v" REPO="$GITHUB_REPOSITORY" node -e "
            const fs=require('fs'),c=require('crypto'),v=process.env.V,base='https://github.com/'+process.env.REPO+'/releases/download/'+v+'/';
            const names=['3zT-Browser-Setup.exe','3zT-Browser-Setup.exe.sha256','3zT-Browser-Setup.exe.sig','3zT-app.json','3zT-app.json.sig'];
            const assets=names.map(n=>({name:n,browser_download_url:base+n,digest:'sha256:'+c.createHash('sha256').update(fs.readFileSync('dist/'+n)).digest('hex')}));
            fs.writeFileSync('dist/latest.json',JSON.stringify({tag_name:v,body:process.env.NOTES,assets}));"
          gh release create "$v" dist/3zT-Browser-Setup.exe dist/3zT-Browser-Setup.exe.sha256 dist/3zT-Browser-Setup.exe.sig dist/3zT-app.json dist/3zT-app.json.sig dist/latest.json --target "$GITHUB_SHA" --title "3zT $v" --notes "$notes"
          echo "::notice title=release::published $v"
