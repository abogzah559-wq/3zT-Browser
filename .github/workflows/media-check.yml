name: Downloader check on real sites

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

jobs:
  real-sites:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Downloader tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch_tools.mjs tools-cache
      - name: Autoconsent package
        run: |
          npm view @duckduckgo/autoconsent dist-tags --json
          node scripts/fetch_autoconsent.mjs
          node -e "const m={exports:{}};new Function('module','exports',require('fs').readFileSync('src/vendor/autoconsent/autoconsent.cjs.js','utf8'))(m,m.exports);console.log('::notice title=autoconsent exports::'+Object.keys(m.exports).join(', '));const r=require('./src/vendor/autoconsent/compact-rules.json');console.log('::notice title=autoconsent rules::keys '+Object.keys(r).join(',')+' rules '+(r.r||[]).length+' index '+JSON.stringify(r.index||null).slice(0,300))"
      - name: Electron (checksum verified)
        shell: bash
        run: |
          base=https://github.com/electron/electron/releases/download/v45.1.0
          f=electron-v45.1.0-win32-x64.zip
          curl -sSfL -o $f $base/$f
          curl -sSfL -o SHASUMS256.txt $base/SHASUMS256.txt
          grep " \*$f\$" SHASUMS256.txt | sed 's/ \*/  /' | sha256sum -c -
          mkdir -p electron-bin && unzip -q $f -d electron-bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-sites
          path: tests/out/
      - name: Diagnosis on real sites (3zT variants and Chrome)
        continue-on-error: true
        env:
          DIAG_FP_ONLY: '1'
        run: node tests/sites-diag.mjs electron-bin/electron.exe .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-sites-diag
          path: tests/out/
