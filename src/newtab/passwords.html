<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كلمات السر</title>
<link rel="icon" href="icons/tab32.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0f;color:#eee;font-family:"Segoe UI",Tajawal,Tahoma,system-ui,sans-serif;color-scheme:dark}
main{max-width:860px;margin:0 auto;padding:26px 20px 60px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{flex:1;margin:0;font-size:22px;font-weight:600}
#q{width:260px;max-width:60vw;padding:9px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;outline:none}
#q:focus{border-color:#8ab4f8}
button{font:inherit;color:inherit;cursor:pointer;padding:7px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:transparent}
button:hover{background:rgba(255,255,255,.08)}
button.primary{background:#8ab4f8;color:#111;border-color:#8ab4f8}
.banner{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.7;margin-bottom:14px}
.banner.ok{border-color:rgba(126,226,168,.35)}
.banner.warn{border-color:rgba(255,184,107,.5)}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.row:hover{background:rgba(255,255,255,.03)}
.site{display:flex;align-items:center;gap:9px;min-width:0}
.site img,.site .ph{flex:none;width:16px;height:16px;border-radius:3px}
.site .ph{background:rgba(255,255,255,.15)}
.site a{color:#eee;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.site a:hover{text-decoration:underline}
.user,.pass{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.pass{font-family:Consolas,monospace;letter-spacing:1px}
.acts{display:flex;gap:4px}
.acts button{padding:4px 8px;font-size:12px;border-radius:10px}
.head{font-size:12px;opacity:.55;border-bottom:1px solid rgba(255,255,255,.12)}
.head:hover{background:none}
#empty{opacity:.55;text-align:center;margin:50px 0}
h2{font-size:14px;opacity:.7;margin:28px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px}
.chip button{padding:0 6px;border:0}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="h">كلمات السر</h1>
    <input id="q" type="search" placeholder="ابحث">
    <button id="imp" class="primary">استيراد من ملف كروم (CSV)</button>
  </header>
  <div id="note" class="banner"></div>
  <div id="result" class="banner" hidden></div>
  <div id="list"></div>
  <p id="empty" hidden></p>
  <h2 id="hNever" hidden>مواقع ما تنحفظ لها كلمات سر</h2>
  <div id="never"></div>
</main>
<script src="passwords.js"></script>
</body>
</html>
