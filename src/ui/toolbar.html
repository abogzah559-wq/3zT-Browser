<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http: chrome-extension:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>toolbar</title>
<link rel="stylesheet" href="toolbar.css">
</head>
<body>
<div id="strip">
  <div id="winctl">
    <button class="wb" id="wMin" data-tip="min"><svg viewBox="0 0 12 12"><path d="M1.5 6h9"/></svg></button>
    <button class="wb" id="wMax" data-tip="max"><svg viewBox="0 0 12 12" id="maxIco"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button>
    <button class="wb" id="wClose" data-tip="close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </div>

  <div id="bar">
    <button class="ib flip" id="back" data-tip="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="ib flip" id="fwd" data-tip="forward"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="ib" id="reload" data-tip="reload">
      <svg viewBox="0 0 24 24" id="icoReload"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      <svg viewBox="0 0 24 24" id="icoStop"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <form id="omni" autocomplete="off">
      <span id="gIco"><svg viewBox="0 0 24 24"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.1a4.4 4.4 0 0 1-1.9 2.9v2.4h3.1c1.8-1.7 2.7-4.1 2.7-7z" fill="#4285F4" stroke="none"/><path d="M12 21.5c2.6 0 4.7-.9 6.3-2.3l-3.1-2.4c-.9.6-2 .9-3.2.9-2.5 0-4.6-1.7-5.3-3.9H3.5v2.5a9.5 9.5 0 0 0 8.5 5.2z" fill="#34A853" stroke="none"/><path d="M6.7 13.8a5.7 5.7 0 0 1 0-3.6V7.7H3.5a9.5 9.5 0 0 0 0 8.6z" fill="#FBBC05" stroke="none"/><path d="M12 6.3c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9.5 9.5 0 0 0 3.5 7.7l3.2 2.5C7.4 8 9.5 6.3 12 6.3z" fill="#EA4335" stroke="none"/></svg></span>
      <input id="addr" type="text" spellcheck="false">
      <button type="button" class="ib sm" id="star" data-tip="star"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <div id="load"></div>
    </form>

    <button class="ib" id="ext" data-tip="ext"><svg viewBox="0 0 24 24"><path d="M9 4.5a2 2 0 0 1 4 0V6h4v4h1.5a2 2 0 0 1 0 4H17v5H6v-4h1.5a2 2 0 0 0 0-4H6V6h3z"/></svg></button>
    <button class="ib" id="tabsBtn" data-tip="tabs"><span id="tabCount">1</span></button>
    <button class="ib" id="menuBtn" data-tip="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/></svg></button>
  </div>
</div>

<div id="backdrop" hidden></div>
<div id="drop" hidden></div>
<div id="toast" hidden></div>
<script src="toolbar.js"></script>
</body>
</html>
