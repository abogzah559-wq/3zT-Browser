<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http: chrome-extension:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>toolbar</title>
<link rel="stylesheet" href="toolbar.css">
</head>
<body>
<div id="strip">
  <div id="winctl">
    <button class="wb" id="wMin" data-tip="min"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button class="wb" id="wMax" data-tip="max"><svg viewBox="0 0 12 12" id="maxIco"><rect x="2" y="2" width="8" height="8" rx="1.2"/></svg></button>
    <button class="wb" id="wClose" data-tip="close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
  </div>

  <div id="row">
    <div id="tabs">
      <div id="tabList"></div>
      <button class="ib sm" id="newTab" data-tip="newtab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div id="dropMark" hidden></div>
    </div>

    <div id="bar">
      <span id="incog" hidden title=""><svg viewBox="0 0 24 24"><path d="M3 11h18M6 11l2-6h8l2 6"/><circle cx="7.5" cy="16" r="3"/><circle cx="16.5" cy="16" r="3"/><path d="M10.5 16h3"/></svg></span>
      <button class="ib flip" id="back" data-tip="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="ib flip" id="fwd" data-tip="forward"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="ib" id="reload" data-tip="reload">
        <svg viewBox="0 0 24 24" id="icoReload"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <svg viewBox="0 0 24 24" id="icoStop"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <form id="omni" autocomplete="off">
        <button type="button" class="ib sm" id="act" data-tip="translate">
          <svg viewBox="0 0 24 24" id="icoTr"><path d="M3 5h9M7.5 3v2M5 5c.6 3 2.6 5.6 5.5 7M10 5c-.6 3-3 6-6.5 7.5"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/></svg>
          <svg viewBox="0 0 24 24" id="icoSearch"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        </button>
        <input id="addr" type="text" spellcheck="false">
        <input id="findq" type="text" spellcheck="false">
        <span id="findCount"></span>
        <button type="button" class="ib sm fbtn" id="findPrev"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button type="button" class="ib sm fbtn" id="findNext"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="ib sm fbtn" id="findClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button type="button" class="ib sm" id="shield" data-tip="shield"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4" id="shOk"/></svg><span id="shCount"></span></button>
        <button type="button" class="ib sm" id="star" data-tip="star"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
        <div id="load"></div>
      </form>

      <div id="pins"></div>
      <button class="ib" id="ext" data-tip="ext"><svg viewBox="0 0 24 24"><path d="M9 4.5a2 2 0 0 1 4 0V6h4v4h1.5a2 2 0 0 1 0 4H17v5H6v-4h1.5a2 2 0 0 0 0-4H6V6h3z"/></svg></button>
      <button class="ib" id="menuBtn" data-tip="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/></svg></button>
    </div>
  </div>
</div>

<div id="backdrop" hidden></div>
<div id="drop" hidden></div>
<div id="toast" hidden></div>
<script src="toolbar.js"></script>
</body>
</html>
